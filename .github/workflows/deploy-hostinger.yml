name: Deploy to Hostinger

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PHP_VERSION: "8.2"
  NODE_VERSION: "20"
  DEPLOY_PATH: ${{ secrets.H_DEPLOY_PATH }}
  PUBLIC_HTML: "/home/u542030658/domains/crowdfunding.eliteacademyfx.com/public_html"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, intl, pdo_mysql, fileinfo, sqlite, pdo_sqlite
          tools: composer
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies (with dev for tests)
        run: composer install --no-interaction --prefer-dist

      - name: Prepare .env.testing (sqlite in-memory)
        run: |
          cp .env.example .env.testing
          php -r "file_put_contents('.env.testing', \"APP_ENV=testing\nAPP_KEY=base64:\".base64_encode(random_bytes(32)).\"\nDB_CONNECTION=sqlite\nDB_DATABASE=:memory:\nSESSION_DRIVER=array\nCACHE_STORE=array\nQUEUE_CONNECTION=sync\n\", FILE_APPEND);"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies (for Vite manifest)
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets (for tests)
        run: npm run build

      - name: Run migrations (testing)
        run: php artisan migrate --env=testing --force

      - name: Run tests
        run: php artisan test --env=testing

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, intl, pdo_mysql, fileinfo
          tools: composer
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies (prod)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Build deploy directory
        run: |
          rm -rf deploy
          mkdir deploy
          rsync -a --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude=".env" \
            --exclude="storage/app/" \
            --exclude="storage/logs/" \
            ./ deploy/

      - name: Deploy to Hostinger (rsync over SSH)
        uses: easingthemes/ssh-deploy@v5.0.3
        env:
          SSH_PRIVATE_KEY: ${{ secrets.H_SSH_KEY }}
          ARGS: "-az --delete --exclude='.env' --exclude='storage/app/' --exclude='storage/logs/'"
          SOURCE: "deploy/"
          REMOTE_HOST: ${{ secrets.H_HOST }}
          REMOTE_USER: ${{ secrets.H_USER }}
          REMOTE_PORT: ${{ secrets.H_PORT }}
          TARGET: ${{ env.DEPLOY_PATH }}
          SSH_ARGS: "-o StrictHostKeyChecking=no"

      - name: Post-deploy tasks (cache and migrations)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.H_HOST }}
          username: ${{ secrets.H_USER }}
          key: ${{ secrets.H_SSH_KEY }}
          port: ${{ secrets.H_PORT }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            ln -sfn ${{ env.DEPLOY_PATH }}/public ${{ env.PUBLIC_HTML }}
            ln -sfn ${{ env.DEPLOY_PATH }}/storage/app/public ${{ env.DEPLOY_PATH }}/public/storage
            php artisan config:clear
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            chmod -R 775 storage bootstrap/cache
